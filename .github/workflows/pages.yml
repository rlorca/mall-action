name: Deploy to GitHub Pages

on:
  push:
    branches: [opus-4-6]

permissions:
  contents: write

concurrency:
  group: gh-pages-deploy
  cancel-in-progress: false

env:
  PUBLISH_DIR: opus-4.6

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Build
        run: npm run build

      - name: Checkout gh-pages
        uses: actions/checkout@v4
        with:
          ref: gh-pages
          path: gh-pages

      - name: Copy build output
        run: |
          rm -rf gh-pages/${{ env.PUBLISH_DIR }}
          cp -r dist gh-pages/${{ env.PUBLISH_DIR }}

      - name: Deploy
        run: |
          cd gh-pages
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && echo "No changes to deploy" && exit 0
          git commit -m "Deploy ${{ env.PUBLISH_DIR }} from ${{ github.sha }}"
          git push
