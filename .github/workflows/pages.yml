name: Publish to GitHub Pages

# Tests and builds this branch, then publishes dist/ into the `gh-pages` branch under $PUBLISH_DIR.
# Every implementation branch has its own copy of this workflow; see AGENTS.md on `main`.
# A failing test blocks the publish.
on:
  push:
    branches: [bevy-sonnet-5-5]
  workflow_dispatch:

permissions:
  contents: write

# One publisher at a time: all implementations push to the same gh-pages branch.
concurrency:
  group: pages-publish
  cancel-in-progress: false

env:
  PUBLISH_DIR: bevy-sonnet-5.5
  WASM_BINDGEN_VERSION: 0.2.130

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust (stable, wasm32 target)
        run: |
          rustup toolchain install stable --profile minimal --target wasm32-unknown-unknown
          rustup default stable
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: cargo-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: cargo-${{ runner.os }}-
      - name: Install wasm-bindgen CLI ${{ env.WASM_BINDGEN_VERSION }} (must match Cargo.lock)
        run: |
          curl -sL "https://github.com/wasm-bindgen/wasm-bindgen/releases/download/${WASM_BINDGEN_VERSION}/wasm-bindgen-${WASM_BINDGEN_VERSION}-x86_64-unknown-linux-musl.tar.gz" | tar xz
          sudo mv wasm-bindgen-${WASM_BINDGEN_VERSION}-x86_64-unknown-linux-musl/wasm-bindgen /usr/local/bin/
          wasm-bindgen --version
      - name: Test (game core + splash)
        run: cargo test -p mall-core -p mall-splash
      - name: Build
        run: ./build.sh
      - name: Publish dist/ to gh-pages/${{ env.PUBLISH_DIR }}
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git clone --depth 1 --branch gh-pages "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" site
          rm -rf "site/$PUBLISH_DIR"
          mkdir -p "site/$PUBLISH_DIR"
          cp -r dist/. "site/$PUBLISH_DIR/"
          cd site
          git add -A
          if git diff --cached --quiet; then echo "nothing to publish"; exit 0; fi
          git commit -m "Publish $PUBLISH_DIR from ${{ github.sha }}"
          git push origin gh-pages
