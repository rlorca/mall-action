name: Publish to GitHub Pages
on:
  push:
    branches: [macroquad-sonnet-5-5]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: pages-publish
  cancel-in-progress: false
env:
  PUBLISH_DIR: macroquad-sonnet-5.5
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: cargo-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}
      # The rules, renderer, art and synth live in `mall-core` (no dependencies, no audio/GL
      # libraries needed), so the tests run natively on a plain runner.
      - name: Test
        run: cargo test -p mall-core --locked
      - name: Build (wasm)
        run: ./build.sh
      - name: Publish dist/ to gh-pages/${{ env.PUBLISH_DIR }}
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git clone --depth 1 --branch gh-pages "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" site
          rm -rf "site/$PUBLISH_DIR"
          mkdir -p "site/$PUBLISH_DIR"
          cp -r dist/. "site/$PUBLISH_DIR/"
          cd site
          git add -A
          if git diff --cached --quiet; then echo "nothing to publish"; exit 0; fi
          git commit -m "Publish $PUBLISH_DIR from ${{ github.sha }}"
          git push origin gh-pages
