<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>MALL ACTION - FLICKERSOFT</title>
    <meta name="description" content="MALL ACTION: an 8-bit spy caper in an 80s shopping mall. A FLICKERSOFT fan homage." />
    <link rel="icon" href="data:," />
    <style>
      :root { color-scheme: dark; }
      html, body { margin: 0; height: 100%; background: #000; overflow: hidden; }
      body { display: flex; align-items: center; justify-content: center; }
      #stage { position: relative; width: 100vw; height: 100vh; display: flex; align-items: center; justify-content: center; }
      #screen { image-rendering: pixelated; image-rendering: crisp-edges; display: block; }
      #message { position: absolute; inset: 0; display: none; align-items: center; justify-content: center; color: #fcfcfc; font: 16px/1.4 monospace; text-align: center; padding: 16px; box-sizing: border-box; }
      #message.show { display: flex; }
    </style>
  </head>
  <body>
    <div id="stage">
      <canvas id="screen" width="256" height="240"></canvas>
      <div id="message" role="alert"></div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
