<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>MALL ACTION — A FLICKERSOFT Game</title>
    <style>
      html,
      body {
        margin: 0;
        padding: 0;
        background: #000;
        height: 100%;
        overflow: hidden;
      }
      #stage {
        position: fixed;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
      }
      canvas {
        image-rendering: pixelated;
        image-rendering: crisp-edges;
      }
      #nosupport {
        display: none;
        color: #fff;
        font-family: monospace;
        text-align: center;
        padding: 2em;
      }
    </style>
  </head>
  <body>
    <div id="stage"><canvas id="game"></canvas></div>
    <div id="nosupport">
      MALL ACTION needs a browser with canvas support.<br />
      Please use a modern desktop browser.
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
